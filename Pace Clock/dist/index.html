<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d27"><title>Pace Clock</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101d27;color:#edf5f6}*{box-sizing:border-box}body{margin:0;padding:32px 20px}main{max-width:720px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:0}header span{font-size:12px;letter-spacing:2px;color:#88afa9}p{color:#9eb3bf;line-height:1.5}.clock{margin:30px 0 24px;padding:32px 20px;background:#192b37;border:1px solid #2c424e;border-radius:28px;text-align:center}.eyebrow{color:#76dfc0;letter-spacing:2px;text-transform:uppercase;font-size:12px}#time{font-size:clamp(76px,18vw,130px);font-weight:650;letter-spacing:-6px;font-variant-numeric:tabular-nums;margin:4px 0}progress{width:100%;height:6px;accent-color:#76dfc0}#detail{margin:20px 0 0;font-size:14px}.buttons{display:flex;gap:10px;margin-top:26px}button{font:inherit;border:1px solid #3a5360;border-radius:14px;padding:14px 18px;background:#233946;color:#eff8fb;cursor:pointer}#start{background:#76dfc0;color:#102e29;border:0;flex:1;font-weight:700}button:disabled{opacity:.5;cursor:default}.settings{background:#152632;padding:24px;border-radius:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;font-size:14px;color:#c4d5df}input[type=number]{width:100%;font:inherit;font-size:22px;background:#101d27;color:white;border:1px solid #3a5360;border-radius:10px;padding:12px;margin-top:9px}small{display:block;font-size:12px;color:#9eb3bf;margin-top:8px;line-height:1.5}.check{display:flex;gap:9px;align-items:center;margin-top:20px}input[type=checkbox]{accent-color:#76dfc0;width:18px;height:18px}#sequence{color:#76dfc0;font-size:14px;line-height:1.6;margin:22px 0 0}footer{font-size:12px;color:#8fa5b1;margin-top:20px;text-align:center}#error{color:#ffb2a6;margin-bottom:0} @media(max-width:420px){body{padding:24px 14px}.grid{gap:14px}.settings{padding:20px}header span{display:none}}
</style></head><body><main><header><h1>Pace Clock</h1></header><p>A little shorter. A little longer. Your pace.</p><section class="clock"><div class="eyebrow" id="status">Ready · Round 1</div><div id="time" role="timer" aria-label="Time remaining">1:00</div><progress id="progress" value="1" max="1" aria-label="Round progress"></progress><p id="detail">60 second round · Next: 59 seconds</p><div class="buttons"><button id="start">Start timer</button><button id="reset">Reset</button></div></section><section class="settings"><div class="grid"><label>Starting duration (seconds)<input id="duration" type="number" min="1" max="86400" step="1" value="60"><small>Length of the first countdown.</small></label><label>Change per round (seconds)<input id="change" type="number" min="-86400" max="86400" step="1" value="-1"><small>−1 gets shorter. +1 gets longer. 0 repeats.</small></label><label>Round limit<input id="limit" type="number" min="1" max="10000" step="1" placeholder="No limit"><small>Optional. Shorter rounds also stop before zero.</small></label></div><label class="check"><input id="sound" type="checkbox" checked>Play a tone after each round</label><p id="sequence"></p><p id="error" role="alert"></p></section><footer>Keep this page open for reliable timing and sound.</footer></main><script>
const $=id=>document.getElementById(id);let config,round=1,length=60,remaining=60000,deadline=0,running=false,finished=false,audioCtx,wake;
function settings(){const start=Number($('duration').value),step=Number($('change').value),limit=$('limit').value===''?Infinity:Number($('limit').value);if(!$('duration').value||!$('change').value||!Number.isInteger(start)||start<1||start>86400||!Number.isInteger(step)||Math.abs(step)>86400||!(limit===Infinity||Number.isInteger(limit)&&limit>=1&&limit<=10000)){throw Error('Enter whole seconds: start 1–86,400; change −86,400 to +86,400; optional rounds 1–10,000.')}return {start,step,limit}}
function tone(){if(!$('sound').checked||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=finished?660:880;g.gain.setValueAtTime(.18,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.35);o.start();o.stop(audioCtx.currentTime+.35)}
async function screenOn(){try{if('wakeLock' in navigator&&running)wake=await navigator.wakeLock.request('screen')}catch{}}
function release(){if(wake){wake.release();wake=null}}
function render(){const sec=Math.ceil(remaining/1000);$('time').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');$('progress').value=remaining/(length*1000);$('status').textContent=(finished?'Complete':running?'Running':remaining===length*1000?'Ready':'Paused')+' · Round '+round;$('start').textContent=finished?'Start again':running?'Pause':remaining===length*1000?'Start timer':'Resume';const next=length+config.step;$('detail').textContent=finished?'Session finished':length+' second round · '+(round>=config.limit||next<=0?'Final round':'Next: '+next+' seconds');for(const id of ['duration','change','limit'])$(id).disabled=running||(!finished&&remaining!==length*1000)||round>1&&!finished}
function reset(){running=false;finished=false;release();try{config=settings();$('error').textContent=''}catch(e){$('error').textContent=e.message;return false}round=1;length=config.start;remaining=length*1000;const seq=[];for(let i=0;i<5&&i<config.limit;i++){const v=config.start+i*config.step;if(v<=0)break;seq.push(v+'s')}$('sequence').textContent='Your rounds: '+seq.join(' → ')+(config.limit>seq.length&&config.start+seq.length*config.step>0?' → …':'');render();return true}
function tick(){if(!running)return;const now=performance.now();let crossed=false;while(running&&now>=deadline){crossed=true;const next=length+config.step;if(round>=config.limit||next<=0){running=false;finished=true;remaining=0;release();break}round++;length=next;deadline+=length*1000}if(running)remaining=Math.max(0,deadline-now);if(crossed)tone();render()}
$('start').onclick=async()=>{if(running){tick();if(running){running=false;release();render()}return}if(finished&&!reset())return;if(round===1&&remaining===length*1000&&!reset())return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume()}catch{}running=true;deadline=performance.now()+remaining;screenOn();render()};$('reset').onclick=()=>{if(window.confirm('Reset the timer? This will end the current session and return to round 1.'))reset()};for(const id of ['duration','change','limit'])$(id).oninput=()=>{if(!running)reset()};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();screenOn()}});setInterval(tick,50);reset();
</script></body></html>
